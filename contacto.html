<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Cotizaciones | Vicmar Services Quito</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" type="image/png" href="img/icono2.png">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --primary: #0d47a1; --light: #f4f7fc; }
        body { background-color: var(--light); color: #2c3e50; font-family: 'Segoe UI', system-ui, sans-serif; margin:0; }
        
        .seccion-contacto-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1100px; margin: 40px auto; padding: 0 20px 60px; }
        
        .tarjeta-contacto { background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 25px; display: flex; align-items: center; gap: 20px; text-decoration: none; color: inherit; box-shadow: 0 5px 15px rgba(0,0,0,0.01); transition: transform 0.3s; }
        .tarjeta-contacto:hover { transform: translateY(-3px); }
        .icon-contacto { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background-color: #eff6ff; color: var(--primary); }

        .formulario-contacto-box { background: #ffffff; border-radius: 16px; padding: 35px; border-top: 5px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .form-control { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 15px; border: 2px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none; }
        .form-control:focus { border-color: var(--primary); }
        .btn-enviar-formulario { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><img src="img/rotulo1.png" alt="Vicmar Services" width="350" height="120"></a>
    </div>
    <nav aria-label="Menú principal">
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="proyectos.html">Proyectos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html" class="active">Contacto</a>
    </nav>
</header>

<main class="seccion-contacto-container">
    <div style="display:flex; flex-direction:column; gap:20px;">
        <h2 style="color:var(--primary); margin:0;">Medios de Atención</h2>
        <a href="https://wa.me" class="tarjeta-contacto" target="_blank" rel="noopener">
            <div class="icon-contacto" style="background-color:#e8fbf1; color:#25d366;"><i class="fa-brands fa-whatsapp"></i></div>
            <div><h3>WhatsApp</h3><p>099 270 5273 (Respuesta Ágil)</p></div>
        </a>
        <a href="tel:+593992705273" class="tarjeta-contacto">
            <div class="icon-contacto"><i class="fa-solid fa-phone"></i></div>
            <div><h3>Llamadas</h3><p>+593 99 270 5273</p></div>
        </a>
    </div>

    <div class="formulario-contacto-box">
        <h2>Solicitar Presupuesto Técnico</h2>
        <form action="#" method="POST">
            <label>Nombre Completo:</label>
            <input type="text" class="form-control" required placeholder="Ej. Juan Pérez">
            <label>Celular de Contacto:</label>
            <input type="tel" class="form-control" required placeholder="Ej. 0992705273">
            <label>Mensaje Técnico:</label>
            <textarea class="form-control" style="min-height:100px;" required placeholder="Describe brevemente el problema de mantenimiento..."></textarea>
            <button type="submit" class="btn-enviar-formulario">Enviar Solicitud Web</button>
        </form>
    </div>
</main>

<footer><p>© 2025 Vicmar Services - Todos los derechos reservados.</p></footer>
</body>
</html>
