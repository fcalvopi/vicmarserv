<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Servicios de mantenimiento en Quito | Vicmar Services</title>

<meta name="description" content="Servicios profesionales en Quito: electricidad, plomería, pintura, aluminio e impermeabilización. Atención inmediata.">

<link rel="stylesheet" href="css/estilos.css">
<link rel="icon" href="favicon2.ico">

<style>
.formulario {
    max-width: 500px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.formulario input,
.formulario textarea {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
.formulario button {
    background: #25D366;
    color: white;
    padding: 12px;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="img/rotulo1.png" alt="Vicmar Services Quito">
        </a>
    </div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="proyectos.html">Proyectos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
    </nav>
</header>

<main>

<section class="servicios">
    <h1>Servicios de mantenimiento en Quito</h1>
    <p><strong>Atención inmediata - solución garantizada</strong></p>
</section>

<!-- FORMULARIO -->
<section class="cta">
    <h2>Solicita tu cotización</h2>
    <p>🚨 Respuesta rápida - te contactamos en minutos</p>

    <form id="formulario" class="formulario">
        <input type="text" name="nombre" placeholder="Tu nombre" required>
        <input type="tel" name="telefono" placeholder="Tu teléfono" required>
        <input type="email" name="email" placeholder="Tu correo">
        <textarea name="mensaje" placeholder="Describe tu problema" required></textarea>
        <button type="submit">📲 Enviar solicitud</button>
    </form>

    <p id="respuesta"></p>
</section>
<script>
document.getElementById("formulario").addEventListener("submit", function(e) {
  e.preventDefault();

  const nombre = this.nombre.value.trim();
  const telefono = this.telefono.value.trim();
  const email = this.email.value.trim();
  const mensaje = this.mensaje.value.trim();

  const texto = `Hola, soy ${nombre}%0A📞 Tel: ${telefono}%0A📧 Email: ${email}%0A🛠️ Problema: ${mensaje}`;

  const url = `https://wa.me/593969054410?text=${texto}`;

  window.open(url, "_blank");

  // mensaje en pantalla
  document.getElementById("respuesta").innerText = "✅ Redirigiendo a WhatsApp...";

  this.reset();
});
</script>
</main>

<footer>
    <p>© 2026 Vicmar Services</p>
</footer>

</body>
</html>
